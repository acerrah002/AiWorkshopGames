<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Flappy Bird</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    height: 100vh;
}

#gameWrap {
    position: relative;
    min-width: 0;
    border-right: 2px solid #222;
}

#game {
    display: block;
    width: 100%;
    height: 100%;
    background: black;
}

#hud {
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 28px;
    font-weight: bold;
}

#message {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-weight: bold;
    pointer-events: none;
}

#start {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0009;
}

#start button {
    background: #f6c52d;
    border: 0;
    padding: 14px 25px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

#side {
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

h2 {
    font-size: 20px;
    font-weight: 500;
    margin: 0;
}

#camBox {
    position: relative;
    border: 1px solid #333;
    aspect-ratio: 4 / 5;
    background: black;
    overflow: hidden;
}

#video, #skeleton {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#video {
    opacity: 0.12;
}

#skeleton {
    opacity: 1;
}

#status {
    font-size: 14px;
    color: #aaa;
    line-height: 1.5;
}

#toggle {
    padding: 10px;
    background: #171717;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
}

#hint {
    color: #888;
    font-size: 12px;
    line-height: 1.5;
}

@media(max-width: 700px) {
    #app {
        grid-template-columns: minmax(0, 1fr) 190px;
    }

    #side {
        padding: 10px 8px;
    }

    h2 {
        font-size: 16px;
    }

    #hud {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="gameWrap">

        <canvas id="game"></canvas>

        <div id="hud">Score: 0</div>

        <div id="message">
            Pinch your index finger and thumb to flap
        </div>

        <div id="start">
            <button id="play">
                START GAME & ENABLE CAMERA
            </button>
        </div>

    </div>

    <aside id="side">

        <h2>Hand Tracking</h2>

        <div id="camBox">
            <video id="video" playsinline></video>
            <canvas id="skeleton"></canvas>
        </div>

        <div id="status">
            Camera: <strong>Not started</strong><br>
            Gesture: <strong>Waiting</strong>
        </div>

        <button id="toggle">Enable camera</button>

        <div id="hint">
            Show one hand to the camera.
            Bring your index fingertip and thumb tip together to flap.
        </div>

    </aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

// ===============================
// GAME VARIABLES
// ===============================

const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');

const wrap = document.querySelector('#gameWrap');

const video = document.querySelector('#video');

const sk = document.querySelector('#skeleton');
const sx = sk.getContext('2d');

const statusEl = document.querySelector('#status');
const msg = document.querySelector('#message');
const start = document.querySelector('#start');

let W = 900;
let H = 650;

let bird = {
    x: 150,
    y: 280,
    vy: 0,
    r: 15
};

let pipes = [];

let score = 0;
let playing = false;
let dead = false;

let lastPipe = 0;

let cam = null;

let closed = false;
let wasClosed = false;


// ===============================
// RESIZE
// ===============================

function resize() {

    const r = wrap.getBoundingClientRect();
    const d = devicePixelRatio || 1;

    W = r.width;
    H = r.height;

    canvas.width = W * d;
    canvas.height = H * d;

    ctx.setTransform(d, 0, 0, d, 0, 0);

    sk.width = sk.clientWidth * d;
    sk.height = sk.clientHeight * d;

    sx.setTransform(d, 0, 0, d, 0, 0);
}

window.addEventListener('resize', resize);

resize();


// ===============================
// GAME RESET
// ===============================

function reset() {

    bird = {
        x: W * 0.22,
        y: H * 0.45,
        vy: 0,
        r: 15
    };

    pipes = [];

    score = 0;
    dead = false;
    playing = true;

    lastPipe = 0;

    document.querySelector('#hud').textContent = 'Score: 0';

    msg.textContent = 'Pinch thumb + index finger to flap';

    start.style.display = 'none';
}


// ===============================
// FLAP
// ===============================

function flap() {

    if (!playing) {

        if (dead) {
            reset();
        } else {
            reset();
        }
    }

    bird.vy = -6.2;
}


// ===============================
// CREATE PIPE
// ===============================

function addPipe() {

    let gap = Math.max(145, H * 0.25);

    let top = 70 + Math.random() * (H - gap - 180);

    pipes.push({
        x: W + 40,
        top: top,
        gap: gap,
        passed: false
    });
}


// ===============================
// MAIN GAME LOOP
// ===============================

function game() {

    requestAnimationFrame(game);

    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (playing) {

        bird.vy += 0.28;
        bird.y += bird.vy;

        if (Date.now() - lastPipe > 1450) {

            addPipe();

            lastPipe = Date.now();
        }

        pipes.forEach(p => {

            p.x -= 2.7;

            if (!p.passed && p.x + 62 < bird.x) {

                p.passed = true;

                score++;

                document.querySelector('#hud').textContent =
                    'Score: ' + score;
            }

            let bottom = p.top + p.gap;

            // PIPE COLOR

            ctx.fillStyle = '#36c91e';

            // TOP PIPE

            ctx.fillRect(p.x, 0, 62, p.top);

            ctx.fillRect(
                p.x - 7,
                p.top - 18,
                76,
                18
            );

            // BOTTOM PIPE

            ctx.fillRect(
                p.x,
                bottom,
                62,
                H - bottom
            );

            ctx.fillRect(
                p.x - 7,
                bottom,
                76,
                18
            );

            // PIPE HIGHLIGHTS

            ctx.fillStyle = '#8cff45';

            ctx.fillRect(
                p.x + 9,
                0,
                9,
                p.top - 18
            );

            ctx.fillRect(
                p.x + 9,
                bottom + 18,
                9,
                H - bottom - 18
            );

            // COLLISION

            if (
                bird.x + bird.r > p.x &&
                bird.x - bird.r < p.x + 62 &&
                (
                    bird.y - bird.r < p.top ||
                    bird.y + bird.r > bottom
                )
            ) {
                endGame();
            }

        });

        pipes = pipes.filter(p => p.x > -90);

        if (
            bird.y + bird.r > H - 28 ||
            bird.y - bird.r < 0
        ) {
            endGame();
        }
    }


    // ===============================
    // GROUND
    // ===============================

    ctx.fillStyle = '#278b19';
    ctx.fillRect(0, H - 25, W, 8);

    ctx.fillStyle = '#8b642e';
    ctx.fillRect(0, H - 17, W, 17);


    // ===============================
    // DRAW BIRD
    // ===============================

    ctx.save();

    ctx.translate(bird.x, bird.y);

    ctx.rotate(
        Math.min(0.7, Math.max(-0.5, bird.vy * 0.06))
    );

    // BODY

    ctx.fillStyle = '#f7cf26';

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        bird.r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // EYE

    ctx.fillStyle = '#fff';

    ctx.beginPath();

    ctx.arc(6, -6, 6, 0, Math.PI * 2);

    ctx.fill();

    ctx.fillStyle = '#111';

    ctx.beginPath();

    ctx.arc(8, -6, 2.5, 0, Math.PI * 2);

    ctx.fill();

    // BEAK

    ctx.fillStyle = '#f06b26';

    ctx.beginPath();

    ctx.moveTo(12, 1);

    ctx.lineTo(27, 5);

    ctx.lineTo(12, 9);

    ctx.fill();

    ctx.restore();


    // ===============================
    // GAME OVER
    // ===============================

    if (dead) {

        ctx.fillStyle = '#fff';

        ctx.textAlign = 'center';

        ctx.font = 'bold 32px Arial';

        ctx.fillText(
            'GAME OVER',
            W / 2,
            H * 0.43
        );

        ctx.font = '18px Arial';

        ctx.fillText(
            'Pinch or tap to restart',
            W / 2,
            H * 0.43 + 35
        );
    }
}


// ===============================
// GAME OVER FUNCTION
// ===============================

function endGame() {

    if (!playing) return;

    playing = false;
    dead = true;

    msg.textContent = 'Game over — pinch or tap to restart';
}


// ===============================
// MOUSE / TOUCH SUPPORT
// ===============================

canvas.addEventListener('pointerdown', () => {

    if (dead) {
        reset();
    } else if (playing) {
        flap();
    } else {
        reset();
    }

});


// ===============================
// HAND SKELETON
// ===============================

function drawSkeleton(landmarks) {

    let w = sk.clientWidth;
    let h = sk.clientHeight;

    sx.clearRect(0, 0, w, h);

    if (!landmarks) return;

    const edges = [

        [0,1],

        [1,2],
        [2,3],
        [3,4],

        [0,5],
        [5,6],
        [6,7],
        [7,8],

        [5,9],
        [9,10],
        [10,11],
        [11,12],

        [9,13],
        [13,14],
        [14,15],
        [15,16],

        [13,17],
        [17,18],
        [18,19],
        [19,20],

        [0,17]

    ];

    // DRAW BONES

    sx.lineWidth = 3;
    sx.strokeStyle = '#aaa';

    edges.forEach(([a,b]) => {

        sx.beginPath();

        sx.moveTo(
            landmarks[a].x * w,
            landmarks[a].y * h
        );

        sx.lineTo(
            landmarks[b].x * w,
            landmarks[b].y * h
        );

        sx.stroke();

    });


    // DRAW JOINTS

    landmarks.forEach((p, i) => {

        sx.beginPath();

        sx.arc(
            p.x * w,
            p.y * h,
            i === 4 || i === 8 ? 6 : 3.5,
            0,
            Math.PI * 2
        );

        sx.fillStyle =
            (i === 4 || i === 8)
            ? (closed ? '#55ff62' : '#eee')
            : '#777';

        sx.fill();

        sx.strokeStyle = '#ddd';

        sx.stroke();

    });

}


// ===============================
// MEDIAPIPE HAND TRACKING
// ===============================

async function enableCamera() {

    try {

        statusEl.innerHTML =
            'Camera: <strong>Requesting permission…</strong>';

        const hands = new Hands({

            locateFile: f =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`

        });

        hands.setOptions({

            maxNumHands: 1,

            modelComplexity: 1,

            minDetectionConfidence: 0.6,

            minTrackingConfidence: 0.55

        });


        // HAND DETECTION RESULTS

        hands.onResults(res => {

            const lm = res.multiHandLandmarks?.[0];

            drawSkeleton(lm);

            if (!lm) {

                closed = false;

                statusEl.innerHTML =
                    'Camera: <strong>On</strong><br>' +
                    'Gesture: <strong>Show your hand</strong>';

                return;
            }


            // THUMB TIP = 4
            // INDEX TIP = 8

            const dx = lm[4].x - lm[8].x;

            const dy = lm[4].y - lm[8].y;

            const dist = Math.hypot(dx, dy);


            // PINCH DETECTION

            closed = dist < 0.055;


            statusEl.innerHTML =
                'Camera: <strong>On</strong><br>' +
                'Gesture: <strong style="color:' +
                (closed ? '#5f6' : '#ddd') +
                '">' +
                (closed ? 'Pinched — flap!' : 'Open hand') +
                '</strong>';


            // FLAP ONLY ONCE PER PINCH

            if (closed && !wasClosed) {

                if (dead) reset();

                flap();
            }

            wasClosed = closed;

        });


        // CAMERA INITIALIZATION

        cam = new Camera(video, {

            onFrame: async () => {

                await hands.send({
                    image: video
                });

            },

            width: 640,
            height: 480

        });

        await cam.start();

        statusEl.innerHTML =
            'Camera: <strong>On</strong><br>' +
            'Gesture: <strong>Show your hand</strong>';

        document.querySelector('#toggle').textContent =
            'Camera enabled';

    } catch (e) {

        statusEl.innerHTML =
            'Camera: <strong>Could not start</strong><br>' +
            'Allow camera access and use localhost or HTTPS.';

        console.error(e);

    }
}


// ===============================
// BUTTONS
// ===============================

document.querySelector('#play').onclick = async () => {

    await enableCamera();

    reset();

};

document.querySelector('#toggle').onclick = enableCamera;


// START GAME LOOP

game();

</script>

</body>
</html>
