<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Flappy Bird</title>

<style>
* { box-sizing: border-box; }

html, body { height: 100%; }

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px;
    height: 100vh;
    height: 100dvh;
}

#gameWrap {
    position: relative;
    min-width: 0;
    border-right: 2px solid #222;
}

#game {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    touch-action: manipulation;
}

#hud {
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 28px;
    font-weight: bold;
    pointer-events: none;
}

#best {
    display: block;
    font-size: 14px;
    font-weight: normal;
    color: #888;
    margin-top: 2px;
}

#message {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-weight: bold;
    pointer-events: none;
    width: 70%;
}

#start {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000a;
}

#start button {
    background: #f6c52d;
    border: 0;
    padding: 14px 25px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

#side {
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

h2 { font-size: 20px; font-weight: 500; margin: 0; }

/* Tracking panel: pure black, skeleton only */
#camBox {
    position: relative;
    border: 1px solid #333;
    aspect-ratio: 4 / 3;
    background: #000;
    overflow: hidden;
}

/* The camera feed stays alive for the tracker but is never visible */
#video {
    position: absolute;
    width: 2px;
    height: 2px;
    opacity: 0;
    pointer-events: none;
}

#skeleton {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#status { font-size: 14px; color: #aaa; line-height: 1.5; }

#toggle {
    padding: 10px;
    background: #171717;
    color: #fff;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
}

#hint { color: #888; font-size: 12px; line-height: 1.5; }

@media (max-width: 700px) {
    #app { grid-template-columns: minmax(0, 1fr) 190px; }
    #side { padding: 10px 8px; }
    h2 { font-size: 16px; }
    #hud { font-size: 20px; }
}
</style>
</head>

<body>

<div id="app">

    <div id="gameWrap">
        <canvas id="game"></canvas>

        <div id="hud">Score: 0<span id="best">Best: 0</span></div>

        <div id="message">Pinch your index finger and thumb to flap</div>

        <div id="start">
            <button id="play">START GAME &amp; ENABLE CAMERA</button>
        </div>
    </div>

    <aside id="side">
        <h2>Hand Tracking</h2>

        <div id="camBox">
            <video id="video" playsinline muted></video>
            <canvas id="skeleton"></canvas>
        </div>

        <div id="status">
            Camera: <strong>Not started</strong><br>
            Gesture: <strong>Waiting</strong>
        </div>

        <button id="toggle">Enable camera</button>

        <div id="hint">
            Show one hand to the camera. Bring your index fingertip and
            thumb tip together to flap. You can also click, tap or press Space.
        </div>
    </aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
// =====================================================
// ELEMENTS
// =====================================================
const canvas   = document.querySelector('#game');
const ctx      = canvas.getContext('2d');
const wrap     = document.querySelector('#gameWrap');
const video    = document.querySelector('#video');
const sk       = document.querySelector('#skeleton');
const sx       = sk.getContext('2d');
const statusEl = document.querySelector('#status');
const msg      = document.querySelector('#message');
const startEl  = document.querySelector('#start');
const hud      = document.querySelector('#hud');
const toggleBtn = document.querySelector('#toggle');

// =====================================================
// CONSTANTS (tuned per 1/60s physics step)
// =====================================================
const STEP        = 1000 / 60;
const GRAVITY     = 0.28;
const FLAP_VY     = -6.2;
const PIPE_SPEED  = 2.7;
const PIPE_W      = 62;
const CAP_W       = 76;
const CAP_H       = 18;
const PIPE_EVERY  = 88;      // steps between pipes
const GROUND_H    = 25;
const RESTART_LOCKOUT = 700; // ms after dying before a flap can restart

// =====================================================
// STATE
// =====================================================
let W = 900, H = 650;

// 'ready' = bird hovers until first flap, 'playing', 'dead'
let state = 'ready';
let bird, pipes, score, spawnTimer, deadAt = 0, hoverT = 0;
let best = 0;
try { best = +localStorage.getItem('handFlappyBest') || 0; } catch (e) {}

// =====================================================
// RESIZE
// =====================================================
function resize() {
    const d = window.devicePixelRatio || 1;

    const r = wrap.getBoundingClientRect();
    W = r.width;
    H = r.height;
    canvas.width  = Math.round(W * d);
    canvas.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);

    sk.width  = Math.round(sk.clientWidth  * d);
    sk.height = Math.round(sk.clientHeight * d);
    sx.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(resize).observe(wrap);
window.addEventListener('resize', resize);
resize();

// =====================================================
// GAME CONTROL
// =====================================================
function setHud() {
    hud.firstChild.textContent = 'Score: ' + score;
    document.querySelector('#best').textContent = 'Best: ' + best;
}

function reset() {
    bird = { x: W * 0.22, y: H * 0.45, vy: 0, r: 15 };
    pipes = [];
    score = 0;
    spawnTimer = PIPE_EVERY; // first pipe appears right after the first flap
    state = 'ready';
    msg.textContent = 'Pinch thumb + index finger to flap';
    startEl.style.display = 'none';
    setHud();
}

function die() {
    if (state !== 'playing') return;
    state = 'dead';
    deadAt = performance.now();
    if (score > best) {
        best = score;
        try { localStorage.setItem('handFlappyBest', best); } catch (e) {}
    }
    setHud();
    msg.textContent = 'Game over — pinch or tap to restart';
}

// One entry point for every input (pinch, click, tap, Space)
function press() {
    if (state === 'ready') {
        state = 'playing';
        msg.textContent = 'Pinch thumb + index finger to flap';
        bird.vy = FLAP_VY;
    } else if (state === 'playing') {
        bird.vy = FLAP_VY;
    } else if (state === 'dead') {
        // Short lockout so a pinch you were already holding doesn't skip Game Over
        if (performance.now() - deadAt > RESTART_LOCKOUT) reset();
    }
}

canvas.addEventListener('pointerdown', press);
window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); press(); }
});

// =====================================================
// PIPES
// =====================================================
function addPipe() {
    const floor = H - GROUND_H;
    const gap = Math.min(220, Math.max(150, H * 0.27));
    const margin = 60;
    const range = Math.max(10, floor - gap - margin * 2);
    const top = margin + Math.random() * range;

    pipes.push({ x: W + 40, top, gap, passed: false });
}

// circle vs rectangle
function hitsRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
}

// =====================================================
// UPDATE (fixed 60Hz step, independent of monitor refresh rate)
// =====================================================
function update() {
    if (state === 'ready') {
        hoverT += 0.08;
        bird.y = H * 0.45 + Math.sin(hoverT) * 8;
        bird.vy = 0;
        return;
    }
    if (state !== 'playing') return;

    bird.vy += GRAVITY;
    bird.y  += bird.vy;

    if (++spawnTimer >= PIPE_EVERY) {
        addPipe();
        spawnTimer = 0;
    }

    const hitR = bird.r - 2; // slightly forgiving hitbox

    for (const p of pipes) {
        p.x -= PIPE_SPEED;

        if (!p.passed && p.x + PIPE_W < bird.x) {
            p.passed = true;
            score++;
            setHud();
        }

        const bottom = p.top + p.gap;

        if (
            hitsRect(bird.x, bird.y, hitR, p.x, 0, PIPE_W, p.top - CAP_H) ||
            hitsRect(bird.x, bird.y, hitR, p.x - (CAP_W - PIPE_W) / 2, p.top - CAP_H, CAP_W, CAP_H) ||
            hitsRect(bird.x, bird.y, hitR, p.x - (CAP_W - PIPE_W) / 2, bottom, CAP_W, CAP_H) ||
            hitsRect(bird.x, bird.y, hitR, p.x, bottom + CAP_H, PIPE_W, H)
        ) {
            die();
            return;
        }
    }

    pipes = pipes.filter(p => p.x > -90);

    if (bird.y + bird.r > H - GROUND_H) {
        bird.y = H - GROUND_H - bird.r;
        die();
    } else if (bird.y - bird.r < 0) {
        bird.y = bird.r;
        bird.vy = 0; // bump off the ceiling instead of dying instantly
    }
}

// =====================================================
// DRAW
// =====================================================
function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // pipes
    const capOff = (CAP_W - PIPE_W) / 2;
    for (const p of pipes) {
        const bottom = p.top + p.gap;

        ctx.fillStyle = '#36c91e';
        ctx.fillRect(p.x, 0, PIPE_W, p.top - CAP_H);
        ctx.fillRect(p.x - capOff, p.top - CAP_H, CAP_W, CAP_H);
        ctx.fillRect(p.x - capOff, bottom, CAP_W, CAP_H);
        ctx.fillRect(p.x, bottom + CAP_H, PIPE_W, H - bottom - CAP_H);

        ctx.fillStyle = '#8cff45';
        ctx.fillRect(p.x + 9, 0, 9, p.top - CAP_H);
        ctx.fillRect(p.x + 9, bottom + CAP_H, 9, H - bottom - CAP_H);
    }

    // ground
    ctx.fillStyle = '#278b19';
    ctx.fillRect(0, H - GROUND_H, W, 8);
    ctx.fillStyle = '#8b642e';
    ctx.fillRect(0, H - GROUND_H + 8, W, GROUND_H - 8);

    // bird
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(Math.min(0.7, Math.max(-0.5, bird.vy * 0.06)));

    ctx.fillStyle = '#f7cf26';
    ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(6, -6, 6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(8, -6, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#f06b26';
    ctx.beginPath();
    ctx.moveTo(12, 1); ctx.lineTo(27, 5); ctx.lineTo(12, 9);
    ctx.fill();

    ctx.restore();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';

    if (state === 'dead') {
        ctx.font = 'bold 32px Arial';
        ctx.fillText('GAME OVER', W / 2, H * 0.43);
        ctx.font = '18px Arial';
        ctx.fillText('Score ' + score + '  ·  Best ' + best, W / 2, H * 0.43 + 32);
        ctx.fillText('Pinch or tap to restart', W / 2, H * 0.43 + 60);
    } else if (state === 'ready') {
        ctx.font = 'bold 22px Arial';
        ctx.fillText('Pinch to flap — get ready', W / 2, H * 0.30);
    }
}

// =====================================================
// MAIN LOOP — fixed timestep so speed is the same on 60/120/144Hz screens
// =====================================================
let last = performance.now();
let acc = 0;

function frame(t) {
    requestAnimationFrame(frame);
    acc += Math.min(100, t - last);
    last = t;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
}

reset();
startEl.style.display = 'grid'; // show the start overlay on load
requestAnimationFrame(frame);

// =====================================================
// SKELETON (black background, no camera image)
// =====================================================
const EDGES = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
];

function clearSkeleton() {
    sx.fillStyle = '#000';
    sx.fillRect(0, 0, sk.clientWidth, sk.clientHeight);
}

function drawSkeleton(lm, pinched) {
    const w = sk.clientWidth, h = sk.clientHeight;
    clearSkeleton();
    if (!lm) return;

    // mirror horizontally so it moves like a mirror
    const X = p => (1 - p.x) * w;
    const Y = p => p.y * h;

    sx.lineWidth = 3;
    sx.lineCap = 'round';
    sx.strokeStyle = '#bbb';
    sx.beginPath();
    for (const [a, b] of EDGES) {
        sx.moveTo(X(lm[a]), Y(lm[a]));
        sx.lineTo(X(lm[b]), Y(lm[b]));
    }
    sx.stroke();

    // line between thumb and index tips
    sx.strokeStyle = pinched ? '#55ff62' : '#555';
    sx.lineWidth = 2;
    sx.beginPath();
    sx.moveTo(X(lm[4]), Y(lm[4]));
    sx.lineTo(X(lm[8]), Y(lm[8]));
    sx.stroke();

    for (let i = 0; i < lm.length; i++) {
        const tip = i === 4 || i === 8;
        sx.beginPath();
        sx.arc(X(lm[i]), Y(lm[i]), tip ? 6 : 3.5, 0, Math.PI * 2);
        sx.fillStyle = tip ? (pinched ? '#55ff62' : '#eee') : '#777';
        sx.fill();
    }
}

clearSkeleton();

// =====================================================
// STATUS (only touches the DOM when text actually changes)
// =====================================================
let lastStatus = '';
function setStatus(camera, gesture, color) {
    const html =
        'Camera: <strong>' + camera + '</strong><br>' +
        'Gesture: <strong' + (color ? ' style="color:' + color + '"' : '') + '>' + gesture + '</strong>';
    if (html !== lastStatus) {
        statusEl.innerHTML = html;
        lastStatus = html;
    }
}

// =====================================================
// HAND TRACKING
// =====================================================
let hands = null;
let stream = null;
let camStarting = false;
let camRunning = false;
let busy = false;

let pinched = false;
const PINCH_CLOSE = 0.30; // pinch distance / hand size to count as closed
const PINCH_OPEN  = 0.45; // must open past this to count as open again

function onResults(res) {
    const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];

    if (!lm) {
        pinched = false;
        drawSkeleton(null, false);
        setStatus('On', 'Show your hand');
        return;
    }

    // Measure in aspect-corrected space, relative to hand size,
    // so it works at any distance from the camera.
    const aspect = (video.videoWidth / video.videoHeight) || 4 / 3;
    const d = (a, b) => Math.hypot((a.x - b.x) * aspect, a.y - b.y);

    const handSize = d(lm[0], lm[9]) || 0.001;
    const ratio = d(lm[4], lm[8]) / handSize;

    const was = pinched;
    if (!pinched && ratio < PINCH_CLOSE) pinched = true;
    else if (pinched && ratio > PINCH_OPEN) pinched = false;

    drawSkeleton(lm, pinched);
    setStatus('On', pinched ? 'Pinched — flap!' : 'Open hand', pinched ? '#5f6' : '#ddd');

    // flap once per pinch, immediately in the same frame
    if (pinched && !was) press();
}

async function enableCamera() {
    if (camRunning || camStarting) return;
    camStarting = true;

    try {
        setStatus('Requesting permission…', 'Waiting');

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width:  { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: 60 },
                facingMode: 'user'
            },
            audio: false
        });

        video.srcObject = stream;
        await video.play();

        setStatus('Loading hand model…', 'Waiting');

        hands = new Hands({
            locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,          // lite model: much faster
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        await hands.initialize();        // preload so the first frames aren't slow

        camRunning = true;
        toggleBtn.textContent = 'Camera enabled';
        setStatus('On', 'Show your hand');

        pump();

    } catch (e) {
        console.error(e);
        setStatus('Could not start', 'Allow camera access and use localhost or HTTPS.');
    } finally {
        camStarting = false;
    }
}

// Always process the freshest frame; skip frames while the model is busy
// instead of queueing them (queued frames are what causes lag).
async function pump() {
    if (!camRunning) return;

    if (!busy && video.readyState >= 2) {
        busy = true;
        try { await hands.send({ image: video }); } catch (e) { console.error(e); }
        busy = false;
    }

    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(pump);
    else requestAnimationFrame(pump);
}

// =====================================================
// BUTTONS
// =====================================================
document.querySelector('#play').onclick = () => {
    reset();            // start the game right away; don't wait for the camera
    enableCamera();
};

toggleBtn.onclick = enableCamera;
</script>

</body>
</html>
